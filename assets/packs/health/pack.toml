[description]
ru = "Сон, вода, движение и еда без фанатизма — набор про тело, которое хочет высыпаться и не болеть. Девять дел: от короткой зарядки до овощей на тарелке, два комбо за режим и три ачивки за привычку. Подходит, если хочется начать с малого, а не с марафона."
en = "Sleep, water, movement and food without fanaticism: a pack about a body that wants to rest and stay well. Nine tasks, from a short warm-up to vegetables on the plate, two combos for a steady routine and three achievements for turning it into a habit. Made for starting small instead of starting a marathon."