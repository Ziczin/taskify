[description]
ru = "Пак про мягкие цвета и уход: розовый, мятный и персиковый акценты, шёлк и мрамор на фоне, искристый звук и два готовых набора для маркета. Ничего не нужно настраивать по частям — купи набор и получи весь образ сразу. Внутри есть и отдельные предметы, если хочется собрать своё. Ачивки пака награждают стикерами за спокойные ежедневные дела."
en = "A pack about soft colours and self-care: rose, mint and peach accents, silk and marble backdrops, a sparkling sound and two ready-made bundles for the market. No piecemeal setup — buy a bundle and get the whole look at once. Single items are available too if you want to mix your own. The pack's achievements reward calm everyday progress with stickers."
