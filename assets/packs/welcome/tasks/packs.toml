id = "packs"
kind = "once"
category = "tour"
tags = ["welcome", "setup"]
icon = "bag"

[title]
ru = "Паки и их уровни"
en = "Packs and their levels"

[description]
ru = "Пак — это набор заданий, комбо и ачивок. У каждого пака свой уровень: он растёт от опыта его заданий. В карточке задания можно задать level_from и level_to — тогда задание появляется и пропадает на нужном уровне пака."
en = "A pack is a set of tasks, combos and achievements. Each pack has its own level, growing from the XP of its tasks. A task can set level_from and level_to so it appears and disappears at a given pack level."

[reward]
xp = 10
coins = 2

level_from = 1
level_to = 99

[schedule]
type = "daily"

