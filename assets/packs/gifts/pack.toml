[description]
ru = "Пак ачивок, которые награждают стикерами, а не только монетами: луна, сердце, искра, корона, подарок и комета. Стикеры из этого пака нельзя купить — только заработать, поэтому они сразу попадают на склад и на доску. Условия простые: несколько выполненных дел, активные дни, уровень."
en = "A pack of achievements that reward stickers, not just coins: moon, heart, spark, crown, gift and comet. These stickers cannot be bought — only earned, and they go straight to the warehouse and the board. Conditions are simple: a few completed tasks, active days, level."
