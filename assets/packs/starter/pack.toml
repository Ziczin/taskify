[description]
ru = "Универсальный набор на каждый день: стакан воды утром, разобранная почта, звонок близкому и ещё семнадцать дел, которые незаметно держат жизнь в порядке. Три комбо награждают за серии, десять ачивок — за первые шаги и постоянство. Начинай с него, если не знаешь, с чего начать."
en = "A universal everyday pack: a glass of water in the morning, an empty inbox, a call to someone you love, and seventeen more things that quietly keep life in order. Three combos reward streaks, ten achievements mark your first steps and your consistency. Start here if you do not know where to start."