[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/packs",
    "crates/ui",
]

[workspace.package]
# Номер сборки — 121. Cargo требует semver из трёх чисел, поэтому номер
# сборки хранится в major, а minor/patch всегда нули.
version = "121.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Taskify"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.32"
egui_extras = { version = "0.32", features = ["image"] }
zip = "2"
rand = "0.9"
rfd = "0.15"
walkdir = "2"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

taskify-core = { path = "crates/core" }
taskify-store = { path = "crates/store" }
taskify-packs = { path = "crates/packs" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"
